Complete Solution
Step 1: Deploy the Strict CRD
Create a file named crd.yaml and paste the following schema:

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databasepolicies.ops.example.com
spec:
  group: ops.example.com
  names:
    kind: DatabasePolicy
    plural: databasepolicies
    singular: databasepolicy
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: ["engine", "replicas", "costCenter"]
            properties:
              engine:
                type: string
                enum: ["postgres", "mysql"]
              replicas:
                type: integer
                minimum: 1
                maximum: 5
              costCenter:
                type: string
                pattern: "^[A-Z]{3}-[0-9]{4}$"
Apply the CRD:

kubectl apply -f crd.yaml
kubectl create namespace schema-lab
Step 2: Trigger the API Rejection (The Malformed CR)
Create a file named bad-cr.yaml:

apiVersion: ops.example.com/v1
kind: DatabasePolicy
metadata:
  name: my-policy
  namespace: schema-lab
spec:
  engine: "redis"
  replicas: 10
  costCenter: "engineering"
Attempt to apply it. You will see the API server instantly reject it with a detailed error message explaining exactly which schema rules were violated:

kubectl apply -f bad-cr.yaml
Step 3: Engineer and Apply the Compliant CR
Create a file named good-cr.yaml with valid parameters:

apiVersion: ops.example.com/v1
kind: DatabasePolicy
metadata:
  name: my-policy
  namespace: schema-lab
spec:
  engine: "postgres"
  replicas: 3
  costCenter: "DEV-9921"

Apply it and verify it successfully bypassed the schema guardrails!

kubectl apply -f good-cr.yaml
kubectl get databasepolicies -n schema-lab