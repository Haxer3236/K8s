Complete Solution (Run these commands)
Step 1: Implement Namespace Admin

# Bind the built-in 'admin' ClusterRole specifically to the 'team-alpha' namespace
kubectl create rolebinding ns-admin-binding \
  --clusterrole=admin \
  --serviceaccount=team-alpha:team-lead \
  -n team-alpha

Step 2: Define Break-Glass ClusterRole

cat <<EOF | kubectl apply -f -
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: break-glass-viewer
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log", "pods/exec"]
  verbs: ["get", "create"]
EOF

Step 3: Grant Emergency Access

cat <<EOF | kubectl apply -f -
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incident-responders
subjects:
- kind: ServiceAccount
  name: on-call-user
  namespace: default
roleRef:
  kind: ClusterRole
  name: break-glass-viewer
  apiGroup: rbac.authorization.k8s.io
EOF

Step 4: Verify

# Check Namespace Admin (Should be YES)
kubectl auth can-i create roles --as=system:serviceaccount:team-alpha:team-lead -n team-alpha

# Check Namespace Admin Isolation (Should be NO)
kubectl auth can-i create roles --as=system:serviceaccount:team-alpha:team-lead -n default

# Check Break-Glass Global Access (Should be YES)
kubectl auth can-i get secrets --as=system:serviceaccount:default:on-call-user -n kube-system
