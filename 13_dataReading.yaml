# Scenario
# You are deploying a critical data processing unit for a resource-constrained edge device. This application follows the "Producer-Consumer Pattern" within a single Pod.

# The Producer: Generates critical data logs.
# The Consumer: Processes these logs in real-time.
# The Constraint: Because the edge node has limited hardware, you must strictly define the CPU and Memory usage for both containers to ensure the Kubernetes scheduler places them correctly and kills them if they misbehave (OOM).
# You need to architect this single Pod to handle data sharing and strict resource boundaries simultaneously.

# Task
# Working directory: /home/user

# 1. Define the Pod & Volume:

# Create a Pod named poly-pod.
# Create a shared volume named data-vol of type emptyDir.
# 2. Configure the Producer (Container 1):

# Name: producer
# Image: busybox
# Command: Write a loop that appends "Data chunk generated" to /var/data/stream.txt every 2 seconds.
# Storage: Mount data-vol to /var/data.
# Resources:
# Requests: CPU: 100m, Memory: 64Mi
# Limits: CPU: 200m, Memory: 128Mi
# 3. Configure the Consumer (Container 2):

# Name: consumer
# Image: busybox
# Command: continuously read (tail) the file /var/data/stream.txt.
# Storage: Mount data-vol to /var/data.
# Resources:
# Requests: CPU: 50m, Memory: 32Mi
# Limits: CPU: 100m, Memory: 64Mi
# 4. Verification:

# Apply the manifest.
# Verify the Pod is Running.
# Verify that the consumer container is successfully reading the data generated by the producer.
# Expected Outcome
# poly-pod is in the Running state with 2/2 containers ready.
# Describing the pod shows strict Requests and Limits configured.
# Logs from the consumer container show the stream of data.

apiVersion: v1
kind: Pod
metadata:
  name: poly-pod
spec:
  containers:
    - name: producer
      image: busybox
      command: ['sh', '-c', 'while true; do echo Data chunk generated >> /var/data/stream.txt; sleep 2; done ']
      volumeMounts:
        - name: data-vol
          mountPath: /var/data
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    - name: consumer
      image: busybox
      command: ['sh', '-c', 'tail -f /var/data/stream.txt']
      volumeMounts:
        - name: data-vol
          mountPath: /var/data
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
           cpu: "100m"
           memory: "64Mi"
  volumes:
    - name: data-vol
      emptyDir: {}
                


