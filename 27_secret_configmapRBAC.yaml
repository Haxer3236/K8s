# Description
# Scenario:

# A junior developer reaches out for urgent help. They deployed a backend application, but the Pods are permanently stuck in the CreateContainerConfigError state.

# The developer suspects a configuration issue but cannot debug it further because the security team has strictly forbidden developers from running kubectl get secrets in the production namespace.

# As the cluster administrator, you investigate and discover two things:

# The developer's deployment is trying to mount a Secret named db-creds, but that Secret literally doesn't exist in the cluster!
# The deployment is using the default Kubernetes ServiceAccount. This is a violation of your team's security best practices, which mandate that all pods must use a dedicated, least-privilege ServiceAccount.
# You must explain the RBAC Blindspot: Developers don't need get secret permissions to deploy an app that uses a Secret. The Kubelet fetches the Secret on behalf of the Pod using the Pod's assigned ServiceAccount.

# Your Mission:

# Deploy the developer's broken baseline. Then, act as the administrator: create the missing Secret, engineer a dedicated ServiceAccount, and patch the Deployment to use it, securely restoring the application.

# Tasks
# Task 1: Deploy the Broken Baseline.

# Create a namespace named rbac-blindspot. Inside it, deploy the backend-app Deployment.

# Do not create the Secret yet. Watch the pods get stuck in CreateContainerConfigError because the Secret is missing.

# Task 2: Create the ServiceAccount. Create a new ServiceAccount named backend-sa in the rbac-blindspot namespace.

# Task 3: Create the Missing Secret. Create an Opaque Secret named db-creds in the same namespace. It must contain a key named password with any valid Base64 string (e.g., c3VwZXJzZWNyZXQ= for "supersecret").

# Task 4: Secure and Fix the Deployment. Update the backend-app Deployment manifest. Inject the serviceAccountName: backend-sa directive into the Pod spec. Apply the updated manifest and verify the new Pod successfully achieves the Running state.

# File-wise Requirements
# 01-baseline.yaml

# Create the rbac-blindspot Namespace.

# Create the backend-app Deployment with pod template label app:backend.

# Image: busybox, Command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]

# Map an environment variable named DB_PASSWORD using valueFrom: secretKeyRef pointing to the Secret db-creds and key password.

# 02-security-patch.yaml

# Create the backend-sa ServiceAccount.
# Create the db-creds Secret with password: c3VwZXJzZWNyZXQ=.
# Include the completely updated backend-app Deployment, adding serviceAccountName: backend-sa under spec.template.spec.
# Expected Outcome:

# The initial deployment fails due to the missing secret.
# You establish a dedicated ServiceAccount for the workload.
# You provide the missing Secret.
# The refactored deployment successfully binds to the custom ServiceAccount, mounts the Secret, and reaches the Running state.

<------------------------------------------------------------------------------------>


Complete Solution
Step 1: Deploy the Corrupted Architecture
Create a file named 01-corrupted-baseline.yaml and paste the following:

apiVersion: v1
kind: Namespace
metadata:
  name: base64-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: base64-lab
type: Opaque
data:
  DB_PASS: "YWRtaW4xMjMK" # Corrupted: contains trailing newline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-client
  namespace: base64-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-client
  template:
    metadata:
      labels:
        app: db-client
    spec:
      containers:
        - name: client
          image: busybox
          # This command simulates an app crashing if the password isn't exactly 'admin123'
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ "$DB_PASS" = "admin123" ]; then
                echo "Connected!";
                while true; do sleep 3600; done;
              else
                echo "Authentication Failed: Invalid Password";
                exit 1;
              fi
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASS
Apply the baseline and watch it crash:

kubectl apply -f 01-corrupted-baseline.yaml
kubectl get pods -n base64-lab -w
Step 2: Sanitize the Secret
Press Ctrl+C to exit the watch. Create 02-sanitized-secret.yaml to fix the Base64 string:

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: base64-lab
type: Opaque
data:
  DB_PASS: "YWRtaW4xMjM=" # Sanitized: generated via `echo -n "admin123" | base64`
Apply the fix:

kubectl apply -f 02-sanitized-secret.yaml
Step 3: Restart and Verify

# Restart the deployment to inject the clean secret
kubectl rollout restart deployment db-client -n base64-lab

# Watch the new pod safely enter the Running state without crashing!
kubectl get pods -n base64-lab -w