# Description
# Scenario:

# A junior developer attempted to deploy a new microservice that connects to a backend database. The required database password is admin123. The developer generated the Kubernetes Secret, applied it, and spun up the Deployment.

# However, the application immediately crashes on startup with an "Authentication Failed: Invalid Password" error. The developer swears they typed admin123 correctly when generating the Base64 string using their terminal.

# You review their command history and spot the mistake immediately: they used echo "admin123" | base64.

# By default, the standard echo command appends a hidden newline character (\n) to the end of the string. The developer inadvertently encoded admin123\n. When the application decodes the Secret and passes it to the database, the database rejects it because the password contains an invisible line break!

# Your Mission:

# Deploy the developer's broken baseline. Verify the corruption by decoding the Secret. Then, generate a clean Base64 string without the newline, update the Secret, and restart the workload to restore the database connection.

# SUDO Password (if needed): user@123!

# Tasks
# Task 1: Deploy the Corrupted Baseline.

# Create a namespace named base64-lab.

# Deploy the developer's corrupted Secret named db-credentials.

# The corrupted Base64 string for admin123\n is YWRtaW4xMjMK.

# Then, deploy the db-client Deployment which maps this secret to an environment variable.

# Task 2: Diagnose the Corruption. Use kubectl get secret and pipe it to base64 --decode in your terminal to view the trailing newline.

# Task 3:

# Sanitize the Secret. Use the echo -n command in your terminal to generate a clean Base64 string for admin123 (without the newline).

# Update your Secret YAML with this new string and apply it.

# Task 4: Restart & Verify. Perform a rollout restart on the db-client Deployment to inject the sanitized password.

# File-wise Requirements
# 01-corrupted-baseline.yaml

# Create the base64-lab Namespace.

# Create a Secret named db-credentials.

# Create a Deployment named db-client with pod template label db-client .

# Image: busybox

# Command:

# ["/bin/sh", "-c", "if [ "$DB_PASS" = "admin123" ]; then echo 'Connected!'; while true; do sleep 3600; done; 

# else echo 'Authentication Failed'; exit 1; fi"]
# 02-sanitized-secret.yaml

# Define the exact same db-credentials Secret, but replace the DB_PASS value with the clean Base64 string.
# Expected Outcome:

# The initial deployment will fail and enter a CrashLoopBackOff state because the script explicitly checks for strictly admin123 (without a newline).
# The sanitized Secret replaces the corrupted one in the cluster.
# A rollout restart applies the fix, and the new pods successfully achieve the Running state, printing "Connected!" internally.

<-------------------------------------------------------------------------------->
Complete Solution..

Step 1: Deploy the Corrupted Architecture
Create a file named 01-corrupted-baseline.yaml and paste the following:

apiVersion: v1
kind: Namespace
metadata:
  name: base64-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: base64-lab
type: Opaque
data:
  DB_PASS: "YWRtaW4xMjMK" # Corrupted: contains trailing newline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-client
  namespace: base64-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-client
  template:
    metadata:
      labels:
        app: db-client
    spec:
      containers:
        - name: client
          image: busybox
          # This command simulates an app crashing if the password isn't exactly 'admin123'
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ "$DB_PASS" = "admin123" ]; then
                echo "Connected!";
                while true; do sleep 3600; done;
              else
                echo "Authentication Failed: Invalid Password";
                exit 1;
              fi
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASS
Apply the baseline and watch it crash:

kubectl apply -f 01-corrupted-baseline.yaml
kubectl get pods -n base64-lab -w
Step 2: Sanitize the Secret
Press Ctrl+C to exit the watch. Create 02-sanitized-secret.yaml to fix the Base64 string:

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: base64-lab
type: Opaque
data:
  DB_PASS: "YWRtaW4xMjM=" # Sanitized: generated via `echo -n "admin123" | base64`
Apply the fix:

kubectl apply -f 02-sanitized-secret.yaml
Step 3: Restart and Verify

# Restart the deployment to inject the clean secret
kubectl rollout restart deployment db-client -n base64-lab

# Watch the new pod safely enter the Running state without crashing!
kubectl get pods -n base64-lab -w