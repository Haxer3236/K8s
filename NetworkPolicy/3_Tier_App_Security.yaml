
# Scenario:

# You are the Solutions Architect for a large E-Commerce platform. The application is distributed across three separate namespaces to separate concerns:

# web: Hosts the public-facing Frontend.
# api: Hosts the business logic Backend.
# db: Hosts the sensitive Database.
# The Security Requirement:

# To prevent unauthorized access and potential "Lateral Movement" attacks, you must enforce a strict "Chain of Trust" within the cluster.

# The Database should only accept connections from the API tier.

# Direct connections from the Web tier (or any other namespace) must be blocked.

# Objective:

# Your task is to set up the namespace infrastructure and then implement the firewall for the Database. You will use a Namespace Selector to allow traffic from the entire api namespace while blocking everything else.

# Tasks:

# 1. Infrastructure Setup:

# Create three namespaces: web, api, and db.
# Crucial Step: For your Network Policy to recognize the API namespace, you must apply a label to it. Run a command to label the api namespace with name=api.
# 2. Protect the Database:

# Create a manifest named db-tier-policy.yaml.
# Name the policy secure-db-access.
# Deploy it in the db namespace.
# Target: Apply the policy to the Database pod (Label: app: database).
# 3. Define the Rule:

# Source: Allow Ingress traffic only from the namespace labeled name: api.
# Port: Restrict traffic to TCP port 5432.
# Expected Outcome:

# Namespaces web, api, db exist.
# Namespace api has the label name=api.
# Policy secure-db-access exists in db and uses a namespaceSelector to allow the API tier.


Complete Solution
1. Infrastructure Setup:

kubectl create ns web
kubectl create ns api
kubectl create ns db

# Critical: Label the API namespace so the policy can find it
kubectl label ns api name=api

2. Create the Manifest:
vi db-tier-policy.yaml

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-db-access
  namespace: db
spec:
  # 1. Protect the Database (in the 'db' namespace)
  podSelector:
    matchLabels:
      app: database
  policyTypes:
  - Ingress
  ingress:
  # 2. Allow traffic from the ENTIRE 'api' namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: api
    ports:
    - protocol: TCP
      port: 5432

3. Apply the Policy:

kubectl apply -f db-tier-policy.yaml
